name: Release (Windows build)

# Runs when you publish a release on GitHub. Builds the Windows installer +
# portable exe and attaches them to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Keep LF line endings on the Windows runner (tests read source files).
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Windows installer + portable
        run: npm run dist:win

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release/*.exe --clobber
