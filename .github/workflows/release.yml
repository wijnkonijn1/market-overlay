name: Release (Windows build)

# Runs automatically when you publish a release, or by hand from the Actions tab
# ("Run workflow") for an existing release tag. Builds the Windows installer +
# portable exe and attaches them to that release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the files to (e.g. v1.2.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Keep LF line endings on the Windows runner (tests read source files).
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Not via `npm run dist:win`: npm runs scripts with cmd.exe on Windows,
      # which can't parse the inline `ELECTRON_BUILDER_7Z_FILTER=BCJ` variable.
      - name: Build Windows installer + portable
        env:
          ELECTRON_BUILDER_7Z_FILTER: BCJ
        run: |
          node scripts/ensure-koffi-win.cjs
          npm run icons
          npm run build
          npx electron-builder --win nsis portable --publish never
          node scripts/ensure-electron-win-dlls.cjs release/win-unpacked

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/*.exe --clobber
